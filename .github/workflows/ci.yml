name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Node is the only runtime required: no Python, no C++ toolchain, no API key.
      - name: Install
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
